<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Returning to Digital Trails</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; min-height: 100vh; margin: 0; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
        a.button { display: inline-block; margin-top: 16px; padding: 12px 24px; border-radius: 8px; background: #0D96F6; color: #fff; text-decoration: none; font-weight: 600; }
        #manual { display: none; }
    </style>
</head>
<body>
    <main>
        <h1>Returning to Digital Trails…</h1>
        <div id="manual">
            <p>If the app did not open, tap the button below.</p>
            <a class="button" id="open" href="#">Open Digital Trails</a>
        </div>
        <p id="invalid" style="display:none">This link is not valid.</p>
    </main>
    <script>
        (function () {
            var match = window.location.pathname.match(/^\/auth(?:\/([a-z0-9]+))?\/?$/);
            if (!match) {
                document.getElementById("invalid").style.display = "block";
                return;
            }

            var provider = match[1] || "oura";
            var target = "digitaltrails" + provider + "://auth" + window.location.search + window.location.hash;

            document.getElementById("open").href = target;
            window.location.replace(target);
            setTimeout(function () { document.getElementById("manual").style.display = "block"; }, 1000);
        })();
    </script>
</body>
</html>
